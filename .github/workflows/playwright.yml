name: Playwright Tests
# Manual only: the suite runs against a live Pics.io account, so it needs
# PICSIO_EMAIL / PICSIO_PASSWORD repository secrets (an account with a Pics.io password, not Google SSO).
on:
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
      env:
        PICSIO_EMAIL: ${{ secrets.PICSIO_EMAIL }}
        PICSIO_PASSWORD: ${{ secrets.PICSIO_PASSWORD }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
